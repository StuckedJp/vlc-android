name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Configure Git identity
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - name: Install native build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y gperf autopoint gettext
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Configure SSH key for GitHub dependencies
      env:
        SSH_PRIVATE_KEY: ${{ secrets.LIBVLCJNI_SSH_PRIVATE_KEY }}
      run: |
        if [ -z "$SSH_PRIVATE_KEY" ]; then
          echo "Secret LIBVLCJNI_SSH_PRIVATE_KEY is not configured"
          exit 1
        fi

        mkdir -p "$HOME/.ssh"
        chmod 700 "$HOME/.ssh"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/libvlcjni_deploy_key"
        chmod 600 "$HOME/.ssh/libvlcjni_deploy_key"
        ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"

        eval "$(ssh-agent -s)"
        ssh-add "$HOME/.ssh/libvlcjni_deploy_key"
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "GIT_SSH_COMMAND=ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

    - name: Configure Android SDK and NDK
      shell: bash
      run: |
        SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f -executable | sort -V | tail -1)"
        fi
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
          exit 1
        fi

        yes | "$SDKMANAGER" --licenses >/dev/null || true
        "$SDKMANAGER" --install \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;21.4.7075529"

        NDK_ROOT="$SDK_ROOT/ndk/21.4.7075529"
        echo "ANDROID_SDK=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_NDK=$NDK_ROOT" >> "$GITHUB_ENV"

    - name: Build with Gradle
      run: buildsystem/compile.sh -a arm
    - name: Output Results
      run: ls -l application/app/build/outputs/apk/dev
